name: Merge sweep

# Re-drive green PRs that the merge queue evicted, so an eviction is never terminal. auto-merge.yml
# enqueues a green PR once per triggering event (a push, a /review comment, or a fresh pr-build); if the
# merge queue then evicts it — a merge group that could not form, or a rebuild against a moved main that
# failed — nothing re-drives an otherwise-idle green PR and it strands: green on every rubric, never
# merged. This scheduled sweep re-evaluates KIP126's exact-head gate and re-enqueues only PRs that are
# already eligible; it never runs a reviewer and routes out-of-scope or ambiguous PRs to humans.

on:
  schedule:
    - cron: "40 * * * *"   # hourly, offset from housekeeping (:20) and the daily bump
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List actions without enqueuing / updating / flagging"
        type: boolean
        default: false

permissions:
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Re-evaluate eligible KIP126 pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --all-open)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/merge_gate.py "${args[@]}"
