name: Merge sweep

# Reconcile open PRs that missed an event or became stale after main moved. This repository currently
# has no merge queue, so a ready PR gets native auto-merge and a fully-green same-repository PR whose
# only blocker is BEHIND is updated from main. The update is followed by explicit exact-head build and
# performance dispatches; the build dispatch refreshes semantic review and status labels. Forks,
# conflicts, hold-labelled PRs, and ambiguous evidence remain human-owned and fail closed.

on:
  schedule:
    - cron: "40 * * * *"   # hourly, offset from housekeeping (:20) and the daily bump
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List merge and branch-update actions without mutating"
        type: boolean
        default: false

permissions:
  actions: write
  checks: read
  contents: write
  issues: read
  pull-requests: write
  statuses: read

concurrency:
  group: merge-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Reconcile eligible KIP126 pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          set -euo pipefail
          args=(--repo "$REPO" --all-open)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python3 scripts/merge_gate.py "${args[@]}"
