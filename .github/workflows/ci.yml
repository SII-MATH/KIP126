name: CI

on:
  push:
    branches: [main]
    paths:
      - "KIP126.lean"
      - "KIP126/**/*.lean"
      - "KIPBase.lean"
      - "KIPBase/**/*.lean"
      - "migration/kip-base/**"
      - "scripts/kipbase-migration.py"
      - "scripts/KIPBaseAudit.lean"
      - "scripts/test_kipbase_migration.py"
      - "scripts/test_workflow_routing.py"
      - "lakefile.lean"
      - "lake-manifest.json"
      - "lean-toolchain"
      - "scripts/euler-ci.sh"
      - "scripts/sandbox-build.sh"
      - "scripts/Axioms.lean"
      - "scripts/perf/**"
      - "scripts/profile/**"
      - "scripts/pr_status/**"
      - "scripts/ci-build-cache-key.sh"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: main-ci-cache-publisher
  cancel-in-progress: false

jobs:
  build:
    # A queue commit can become main verbatim. Its strict post-merge audit
    # must not create a second check named like the required `build` status.
    name: main-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compute the committed build-input cache key
        id: build-cache-key
        shell: bash
        run: |
          set -euo pipefail
          digest=$(bash scripts/ci-build-cache-key.sh . "$GITHUB_SHA")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "KIP126 build-input digest: $digest"

      - name: Prepare Lean toolchain and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Restore the trusted main compilation baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: base/.lake/build
          key: kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-cache-key.outputs.digest }}
          restore-keys: |
            kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Compile all root libraries once
        run: |
          mkdir -p .lake/build
          if [[ -d base/.lake/build ]]; then cp -a base/.lake/build/. .lake/build/; fi
          lake build

      # A successful ordinary compilation on trusted main can be reused even when
      # later warning/axiom/policy checks reject it. Publication is not an audit
      # attestation: the unchanged gates below still determine the CI result.
      - name: Stage trusted build outputs for pull requests
        run: |
          mkdir -p base/.lake/build
          cp -a .lake/build/. base/.lake/build/

      - name: Save trusted build outputs for pull requests
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          # Keep this path identical to pr-build: cache versions include the path as well as the key.
          path: base/.lake/build
          key: kip126-main-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.build-cache-key.outputs.digest }}

      - name: Run fixed core and project gates
        run: bash scripts/euler-ci.sh

      - name: Configure the Lake cache upload
        id: cachecfg
        env:
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
        run: |
          if [ -n "$LAKE_CACHE_KEY_RAW" ] && [ -n "$S3_ARTIFACT_ENDPOINT" ] && [ -n "$S3_REVISION_ENDPOINT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Lake cache upload not configured; skipping"
          fi

      - name: Publish KIP126 artifacts to the Lake cache
        if: ${{ steps.cachecfg.outputs.enabled == 'true' }}
        env:
          LAKE_ARTIFACT_CACHE: "true"
          LAKE_RESTORE_ARTIFACTS: "true"
          LAKE_NO_CACHE: "true"
          LAKE_CACHE_DIR: ${{ github.workspace }}/.lake/cache
          S3_ARTIFACT_ENDPOINT: ${{ vars.LAKE_CACHE_ARTIFACT_ENDPOINT }}
          S3_REVISION_ENDPOINT: ${{ vars.LAKE_CACHE_REVISION_ENDPOINT }}
          LAKE_CACHE_KEY_RAW: ${{ secrets.LAKE_CACHE_KEY }}
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          KEY="$(printf %s "$LAKE_CACHE_KEY_RAW" | sed -e 's/[[:space:]]*$//')"
          echo "::add-mask::$KEY"
          export LAKE_CACHE_KEY="$KEY"
          CFG="$RUNNER_TEMP/lake-cache.toml"
          cat > "$CFG" <<TOML
          cache.defaultUploadService = "kip126-r2"
          [[cache.service]]
          name = "kip126-r2"
          kind = "s3"
          artifactEndpoint = "$S3_ARTIFACT_ENDPOINT"
          revisionEndpoint = "$S3_REVISION_ENDPOINT"
          TOML
          export LAKE_CONFIG="$CFG"
          lake build >/dev/null
          lake build --no-build -o .lake/outputs.jsonl
          echo "root-package mapping entries: $(wc -l < .lake/outputs.jsonl)"
          lake cache put .lake/outputs.jsonl --service kip126-r2 --repo SII-MATH/KIP126
