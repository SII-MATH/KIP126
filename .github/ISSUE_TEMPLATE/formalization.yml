name: Formalization task
description: A bounded task linked to the authoritative Blueprint
body:
  - type: input
    id: blueprint
    attributes:
      label: Blueprint labels
      description: Stable labels from blueprint/src. For engineering work, write N/A and explain below.
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Statement and scope
      description: State the exact mathematical claim or engineering behavior, including hypotheses and exclusions.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source and locator
      description: Paper theorem, equation, section or table; canonical manifest entry for external inputs. For engineering work, list the affected configuration.
    validations:
      required: true
  - type: textarea
    id: lean
    attributes:
      label: Lean target declarations and files
      description: Preserve public names. For engineering work, list the affected files.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Direct dependencies
      description: Blueprint labels and linked issues, including unfinished prerequisites. Do not maintain a second mathematical DAG here.
    validations:
      required: true
  - type: textarea
    id: trust
    attributes:
      label: External inputs and trust boundary
      description: Identify explicit literature/computation premises and their common model. Distinguish statement, provenance and proof work.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance checks
      description: Commands and observable outcomes. State whether this task accepts statements, engineering behavior or completed proofs; compilation alone is not proof completion.
    validations:
      required: true
