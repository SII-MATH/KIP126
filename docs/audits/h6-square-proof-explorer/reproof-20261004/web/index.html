<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f7f3">
  <title>证明阅读室</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext x='7' y='30' font-size='32' fill='%23264f46'%3E%E2%88%B4%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/katex.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="#proof"><span aria-hidden="true">∴</span> 证明阅读室</a>
    <nav class="main-nav" aria-label="主导航">
      <a href="#proof" data-view="proof">证明</a>
      <a href="#references" data-view="references">引用总览</a>
    </nav>
    <a class="secondary-link" href="#review" data-view="review">审查与版本</a>
  </header>
  <div class="reader-layout">
    <aside id="toc-sidebar" class="toc-sidebar" aria-label="阅读目录">
      <button id="toggle-toc" class="toc-toggle" aria-controls="chapter-nav" aria-expanded="false">证明目录 <span aria-hidden="true">⌄</span></button>
      <div class="toc-label">证明目录</div>
      <nav id="chapter-nav" aria-label="章节目录"></nav>
      <p class="reading-hint">点击句末引用，<br>在旁边查看依据。</p>
    </aside>
    <div class="reading-column">
      <main id="main" tabindex="-1"><p class="empty-state">正在读取正文…</p></main>
      <footer class="site-footer"><span>数学证明</span><a href="#review">范围与记录</a></footer>
    </div>
  </div>
  <div id="drawer-shade" hidden></div>
  <aside id="drawer" class="annotation" aria-label="引用批注" tabindex="-1" hidden inert>
    <div class="annotation-header"><span>随文批注</span><button id="close-drawer" aria-label="关闭批注，返回原句">×</button></div>
    <div id="drawer-content"></div>
  </aside>
  <div id="announcer" class="sr-only" aria-live="polite"></div>
  <script defer src="vendor/katex.js"></script>
  <script defer src="data.js"></script>
  <script defer src="app.js"></script>
</body>
</html>
