name: Review

on:
  workflow_run:
    workflows: [pr-build, blueprint-pr]
    types: [completed]
  issue_comment:
    types: [created]
  # Branch reconciliation dispatches pr-build for the new head; the successful build then uses this
  # explicit path so semantic review never relies on recursive pull_request_target delivery.
  workflow_dispatch:
    inputs:
      pr: { description: "PR number whose exact head passed pr-build", required: true, type: string }

permissions:
  actions: write
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: review-${{ github.event.issue.number || inputs.pr || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  resolve:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.conclusion == 'success'
        && github.event.workflow_run.event == 'pull_request_target')
      || (github.event_name == 'workflow_dispatch' && inputs.pr != '')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null)
    runs-on: ubuntu-24.04
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      initializer: ${{ steps.resolve.outputs.initializer }}
      review_kind: ${{ steps.resolve.outputs.review_kind }}
      idempotency_key: ${{ steps.resolve.outputs.idempotency_key }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COMMENT_BODY: ${{ github.event.comment.body }}
      EVENT: ${{ github.event_name }}
      DISPATCH_PR: ${{ inputs.pr || '' }}
      WEBHOOK_URL: ${{ secrets.MULTICA_REVIEW_WEBHOOK_URL }}
      ROADMAP_REPOSITORY: ${{ vars.EULER_ROADMAP_REPOSITORY }}
      RUBRIC_REVISION: ${{ vars.EULER_RUBRIC_REVISION }}
    steps:
      - name: Resolve authorized trigger and current head
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          PR=''
          EVENT_HEAD=''
          if [[ "$EVENT" == workflow_run ]]; then
            PR=$(jq -r '.workflow_run.pull_requests | if length == 1 then .[0].number else empty end' "$GITHUB_EVENT_PATH")
            EVENT_HEAD=$(jq -r '.workflow_run.head_sha // empty' "$GITHUB_EVENT_PATH")
            if [[ -z "$PR" ]]; then
              PR=$(gh api "repos/$REPO/commits/$EVENT_HEAD/pulls" --jq '[.[] | select(.state == "open" and .draft == false)] | if length == 1 then .[0].number else empty end')
            fi
          elif [[ "$EVENT" == workflow_dispatch ]]; then
            [[ "$DISPATCH_PR" =~ ^[0-9]+$ ]]
            PR="$DISPATCH_PR"
          else
            ACTOR=$(jq -r '.sender.login // empty' "$GITHUB_EVENT_PATH")
            ASSOCIATION=$(jq -r '.comment.author_association // empty' "$GITHUB_EVENT_PATH")
            if ! printf '%s' "$COMMENT_BODY" | grep -qxE '[[:space:]]*/review[[:space:]]*'; then
              echo 'Comment does not contain an exact /review command; skipping.'
              exit 0
            fi
            if PERMISSION=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null); then
              case "$PERMISSION" in
                admin|write|maintain) ;;
                *) echo "Unauthorized /review by $ACTOR (permission=$PERMISSION); skipping."; exit 0 ;;
              esac
            else
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) echo "Unauthorized /review by $ACTOR; permission API unavailable and association=$ASSOCIATION."; exit 0 ;;
              esac
            fi
            PR=$(jq -r '.issue.number // empty' "$GITHUB_EVENT_PATH")
          fi
          test -n "$PR"
          gh api "repos/$REPO/pulls/$PR" > pr.json
          test "$(jq -r .state pr.json)" = open
          test "$(jq -r .draft pr.json)" = false
          HEAD_SHA=$(jq -r .head.sha pr.json)
          BASE_SHA=$(jq -r .base.sha pr.json)
          HEAD_REF=$(jq -r .head.ref pr.json)
          BODY=$(jq -r '.body // ""' pr.json)
          if [[ -n "$EVENT_HEAD" ]]; then
            test "$HEAD_SHA" = "$EVENT_HEAD"
          fi
          printf 'pr=%s\nhead_sha=%s\n' "$PR" "$HEAD_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$HEAD_REF" == agent/euler-initializer/* ]] || \
              grep -Eq '^(Initialization PR|Initialization Repair) for [A-Z][A-Z0-9]*-[1-9][0-9]*$' <<<"$BODY"; then
            echo 'initializer=true' >> "$GITHUB_OUTPUT"
            echo 'Initializer PR: semantic review dispatch intentionally skipped.'
            exit 0
          fi
          echo 'initializer=false' >> "$GITHUB_OUTPUT"

          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          blueprint=false
          lean=false
          while IFS= read -r path; do
            case "$path" in
              blueprint/src/*) blueprint=true ;;
              KIP126.lean|KIP126/*.lean|lakefile.lean|lake-manifest.json|lean-toolchain) lean=true ;;
            esac
          done <<< "$files"
          if [[ "$blueprint" == true && "$lean" == true ]]; then
            REVIEW_KIND=mixed
          elif [[ "$blueprint" == true ]]; then
            REVIEW_KIND=blueprint
          else
            REVIEW_KIND=lean
          fi
          echo "review_kind=$REVIEW_KIND" >> "$GITHUB_OUTPUT"

          test -n "$ROADMAP_REPOSITORY"
          test -n "$RUBRIC_REVISION"
          MERGE_BASE_SHA=$(gh api "repos/$REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          test -n "$MERGE_BASE_SHA"
          gh api "repos/$REPO/commits/$HEAD_SHA/status" > statuses.json
          for CHECK in scope build bump-guard; do
            jq -e --arg name "$CHECK" '
              [.statuses[] | select(.context == $name)] |
              max_by(.updated_at // .created_at) | .state == "success"
            ' statuses.json >/dev/null
          done
          if [[ "$REVIEW_KIND" == blueprint || "$REVIEW_KIND" == mixed ]]; then
            jq -e '
              [.statuses[] | select(.context == "blueprint")] |
              max_by(.updated_at // .created_at) | .state == "success"
            ' statuses.json >/dev/null
          fi
          AIM_ISSUE=$(jq -r '[.title, (.body // ""), .head.ref] | join("\n")' pr.json | \
            grep -m1 -Eo '[A-Z][A-Z0-9]*-[1-9][0-9]*')
          test -n "$AIM_ISSUE"
          jq -n \
            --arg repository "$REPO" \
            --arg roadmap_repository "$ROADMAP_REPOSITORY" \
            --argjson pull_request "$PR" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg merge_base_sha "$MERGE_BASE_SHA" \
            --arg rubric_revision "$RUBRIC_REVISION" \
            --arg review_kind "$REVIEW_KIND" \
            --arg aim_issue "$AIM_ISSUE" \
            --slurpfile statuses statuses.json '
              def evidence($name):
                ($statuses[0].statuses |
                  map(select(.context == $name)) |
                  max_by(.updated_at // .created_at)) as $status |
                {conclusion: "success", head_sha: $head_sha,
                 run_id: ($status.id | tostring),
                 details_url: ($status.target_url // "")};
              {schema: "euler-review.request/v1", repository: $repository,
               roadmap_repository: $roadmap_repository,
               pull_request: $pull_request, head_sha: $head_sha,
               base_sha: $base_sha, merge_base_sha: $merge_base_sha,
               rubric_revision: $rubric_revision, review_kind: $review_kind,
               aim_issue: $aim_issue,
               ci: ({scope: evidence("scope"), build: evidence("build"),
                     "bump-guard": evidence("bump-guard")}
                    + (if $review_kind == "blueprint" or $review_kind == "mixed"
                       then {blueprint: evidence("blueprint")} else {} end))}
            ' > request.json
          KEY=$(jq -jr \
            '[(.repository | ascii_downcase), (.pull_request | tostring), .head_sha, .rubric_revision] | join(":")' \
            request.json | sha256sum | cut -d' ' -f1)
          IDEMPOTENCY_KEY="euler-review-$KEY"
          jq --arg key "$IDEMPOTENCY_KEY" '. + {idempotency_key: $key}' \
            request.json > request-with-key.json
          mv request-with-key.json request.json
          printf 'idempotency_key=%s\n' "$IDEMPOTENCY_KEY" >> "$GITHUB_OUTPUT"

      - name: Mark semantic review pending
        if: steps.resolve.outputs.initializer != 'true' && steps.resolve.outputs.pr != ''
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA='${{ steps.resolve.outputs.head_sha }}'
          CURRENT_STATE=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" --jq '
            [.statuses[] | select(.context == "semantic-review")] |
            if length == 0 then "missing"
            else max_by(.updated_at // .created_at).state
            end
          ')
          case "$CURRENT_STATE" in
            success|failure|error|pending) exit 0 ;;
            missing) ;;
            *) echo "Unknown semantic-review state: $CURRENT_STATE" >&2; exit 1 ;;
          esac
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=pending -f context=semantic-review \
            -f description='Euler semantic review queued'

      - name: Dispatch the Multica Euler reviewer webhook
        if: steps.resolve.outputs.initializer != 'true' && steps.resolve.outputs.pr != ''
        shell: bash
        run: |
          set -euo pipefail
          test -n "$WEBHOOK_URL"
          HTTP=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' \
            --header "Idempotency-Key: ${{ steps.resolve.outputs.idempotency_key }}" \
            --data-binary @request.json "$WEBHOOK_URL")
          test "$HTTP" = 200
          jq -e '.status == "accepted" or .status == "skipped" or .status == "duplicate"' \
            response.json >/dev/null
          jq '{status, run_id}' response.json

      - name: Fail closed on dispatch error
        if: failure() && steps.resolve.outputs.head_sha != '' && steps.resolve.outputs.initializer != 'true'
        run: |
          gh api --method POST "repos/$REPO/statuses/${{ steps.resolve.outputs.head_sha }}" \
            -f state=error -f context=semantic-review \
            -f description='Euler semantic review dispatch failed'

      - name: Refresh the exact-head status label
        if: ${{ always() && steps.resolve.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.resolve.outputs.pr }}
        run: |
          set -euo pipefail
          gh workflow run pr-labels.yml --repo '${{ github.repository }}' --ref main -f pr="$PR"

# All model execution is owned by the Multica Euler reviewer webhook. This workflow only resolves
# trusted PR identity, checks exact-head mechanical evidence, and sends the versioned request.
